name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本，例如 1.1.4"
        required: true
        type: string
      base_version:
        description: "基础 ISO 的 Release 标签，例如 v1.1.3"
        required: true
        default: "v1.1.3"
        type: string
      package_url:
        description: "x86 升级包直链；留空则从目标版本 Release 下载"
        required: false
        default: ""
        type: string
      arm_package_url:
        description: "ARM64 升级包直链；留空则从目标版本 Release 下载"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gateway-iso:
    name: assemble x86_64 installer ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BASE_VERSION: ${{ inputs.base_version }}
          INPUT_PACKAGE_URL: ${{ inputs.package_url }}
          TAG_NAME: ${{ github.ref_name }}
          DEFAULT_BASE_VERSION: ${{ vars.LY_ROUTE_BASE_VERSION || 'v1.1.3' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            base_version="$INPUT_BASE_VERSION"
            package_url="$INPUT_PACKAGE_URL"
          else
            version="${TAG_NAME#v}"
            base_version="$DEFAULT_BASE_VERSION"
            package_url=""
          fi
          case "$version" in
            ""|*[!0-9A-Za-z.+~-]*) echo "invalid version: $version" >&2; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "base_version=$base_version"
            echo "package_url=$package_url"
          } >> "$GITHUB_OUTPUT"
          echo "target=$version base=$base_version package_url=${package_url:-<release asset>}"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso zstd

      - name: Download base ISO
        env:
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download "$BASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ly-route-gateway-gui-installer.iso" \
            --dir work --clobber
          mv work/ly-route-gateway-gui-installer.iso work/base.iso
          test -s work/base.iso

      - name: Download upgrade package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE_URL: ${{ steps.meta.outputs.package_url }}
        run: |
          set -euo pipefail
          mkdir -p work
          if [ -n "$PACKAGE_URL" ]; then
            curl -fL --retry 3 --retry-delay 5 -o work/package.tar.zst "$PACKAGE_URL"
          else
            gh release download "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "ly-route-upgrade-gateway-bookworm-amd64.tar.zst" \
              --dir work --clobber
            mv work/ly-route-upgrade-gateway-bookworm-amd64.tar.zst work/package.tar.zst
          fi
          test -s work/package.tar.zst

      - name: Assemble ISO
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/build-gateway-iso-from-base.sh \
            --version "$VERSION" \
            --package work/package.tar.zst \
            --base-iso work/base.iso \
            --out dist

      - name: Verify payload inside the ISO
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          iso=dist/ly-route-gateway-gui-installer.iso
          xorriso -osirrox on -indev "$iso" \
            -extract /installer/payload/rootfs.tar.zst work/payload.tar.zst \
            -extract /installer/payload/rootfs.tar.zst.sha256 work/payload.sha256 >/dev/null
          actual=$(sha256sum work/payload.tar.zst | awk '{print $1}')
          recorded=$(awk 'NR==1 {print $1}' work/payload.sha256)
          [ "$actual" = "$recorded" ] || { echo "payload checksum mismatch" >&2; exit 1; }
          rm -rf work/rootfs-check && mkdir -p work/rootfs-check
          tar --zstd -xf work/payload.tar.zst -C work/rootfs-check
          grep -qx "LY_ROUTE_VERSION=$VERSION" work/rootfs-check/etc/ly-route/version.env
          echo "payload and version verified: $VERSION"

      - name: Checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mkdir -p dist
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
               --pattern SHA256SUMS --dir dist --clobber 2>/dev/null; then
            grep -v '  ly-route-gateway-gui-installer.iso$' dist/SHA256SUMS > dist/SHA256SUMS.tmp || true
            mv dist/SHA256SUMS.tmp dist/SHA256SUMS
          else
            : > dist/SHA256SUMS
          fi
          ( cd dist && sha256sum ly-route-gateway-gui-installer.iso >> SHA256SUMS )
          sort -k2 dist/SHA256SUMS -o dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ly Route Gateway $VERSION" \
              --generate-notes
          fi
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.iso dist/*.iso.sha256 dist/SHA256SUMS \
            --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-iso-${{ steps.meta.outputs.version }}
          path: |
            dist/*.iso
            dist/*.iso.sha256
            dist/SHA256SUMS
          retention-days: 14

  gateway-arm64:
    name: assemble ARM64 installer
    needs: gateway-iso
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BASE_VERSION: ${{ inputs.base_version }}
          INPUT_ARM_PACKAGE_URL: ${{ inputs.arm_package_url }}
          TAG_NAME: ${{ github.ref_name }}
          DEFAULT_BASE_VERSION: ${{ vars.LY_ROUTE_BASE_VERSION || 'v1.1.3' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            base_version="$INPUT_BASE_VERSION"
            arm_package_url="$INPUT_ARM_PACKAGE_URL"
          else
            version="${TAG_NAME#v}"
            base_version="$DEFAULT_BASE_VERSION"
            arm_package_url=""
          fi
          case "$version" in
            ""|*[!0-9A-Za-z.+~-]*) echo "invalid version: $version" >&2; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "base_version=$base_version"
            echo "arm_package_url=$arm_package_url"
          } >> "$GITHUB_OUTPUT"
          echo "target=$version base=$base_version arm_package_url=${arm_package_url:-<release asset>}"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Download base ARM installer
        env:
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
        run: |
          set -euo pipefail
          mkdir -p work
          asset="ly-route-gateway-arm64-installer.tar.zst"
          gh release download "$BASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir work --clobber
          mv "work/$asset" work/base-arm-installer.tar.zst
          test -s work/base-arm-installer.tar.zst

      - name: Download ARM64 upgrade package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARM_PACKAGE_URL: ${{ steps.meta.outputs.arm_package_url }}
        run: |
          set -euo pipefail
          mkdir -p work
          asset="ly-route-upgrade-gateway-bookworm-arm64.tar.zst"
          if [ -n "$ARM_PACKAGE_URL" ]; then
            curl -fL --retry 3 --retry-delay 5 -o work/arm-package.tar.zst "$ARM_PACKAGE_URL"
          else
            gh release download "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir work --clobber
            mv "work/$asset" work/arm-package.tar.zst
          fi
          test -s work/arm-package.tar.zst

      - name: Assemble ARM64 installer
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/build-arm64-installer-from-base.sh \
            --version "$VERSION" \
            --package work/arm-package.tar.zst \
            --base-installer work/base-arm-installer.tar.zst \
            --out dist \
            --commit "$GITHUB_SHA"

      - name: Verify ARM64 installer
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar --zstd -xf dist/ly-route-gateway-arm64-installer.tar.zst -C "$work"
          grep -qx "LY_ROUTE_VERSION=$VERSION" "$work/overlay/etc/ly-route/version.env"
          ( cd "$work" && sha256sum -c checksums.sha256 >/dev/null )
          plugins=$(find "$work/overlay"/usr/lib/*/vpp_plugins -name 'ly_route_*.so' | wc -l)
          [ "$plugins" -ge 5 ]
          if find "$work" -name 'ly_route_orchestrator_plugin.so' | grep -q .; then
            echo "orchestrator plugin must not be present" >&2
            exit 1
          fi
          rm -rf "$work"
          echo "ARM64 installer verified: $VERSION"

      - name: Publish ARM64 assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          asset="ly-route-upgrade-gateway-bookworm-arm64.tar.zst"
          cp work/arm-package.tar.zst "dist/$asset"
          mkdir -p dist
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag is missing; the x86 job must publish it first" >&2
            exit 1
          fi
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir dist --clobber 2>/dev/null || true
          if [ -f dist/SHA256SUMS ]; then
            grep -v -E '  (ly-route-gateway-arm64-installer\.tar\.zst|ly-route-upgrade-gateway-bookworm-arm64\.tar\.zst)$' \
              dist/SHA256SUMS > dist/SHA256SUMS.tmp || true
            mv dist/SHA256SUMS.tmp dist/SHA256SUMS
          else
            : > dist/SHA256SUMS
          fi
          ( cd dist && sha256sum ly-route-gateway-arm64-installer.tar.zst "$asset" >> SHA256SUMS )
          sort -k2 dist/SHA256SUMS -o dist/SHA256SUMS
          cat dist/SHA256SUMS
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            dist/ly-route-gateway-arm64-installer.tar.zst \
            "dist/$asset" \
            dist/SHA256SUMS \
            --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-arm64-${{ steps.meta.outputs.version }}
          path: |
            dist/ly-route-gateway-arm64-installer.tar.zst
            dist/ly-route-upgrade-gateway-bookworm-arm64.tar.zst
            dist/SHA256SUMS
          retention-days: 14
