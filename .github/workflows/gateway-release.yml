name: Ly Route production artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v1.0.0
        required: false
        type: string

concurrency:
  group: ly-route-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LY_ROUTE_GO_VERSION: go1.26.0
  GOTOOLCHAIN: local
  CGO_ENABLED: '1'
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: off
  TZ: UTC
  LC_ALL: C.UTF-8
  LY_ROUTE_MIRROR: https://mirrors.ustc.edu.cn/debian
  LY_ROUTE_SECURITY_MIRROR: https://mirrors.ustc.edu.cn/debian-security
  LY_ROUTE_SMARTDNS_REF: Release48.3
  LY_ROUTE_XRAY_REF: v26.3.27
  LY_ROUTE_VPP_COMMIT: 744d3c7159ae130fb57f669a826ff1e45ed51836

jobs:
  verify:
    name: Source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/go.sum
      - name: Normalize and check toolchain
        run: |
          chmod +x scripts/*.sh packaging/rootfs-overlay/usr/lib/ly-route/*.sh
          bash scripts/normalize-source-line-endings.sh "$GITHUB_WORKSPACE"
          test "$(go version | awk '{print $3}')" = "$LY_ROUTE_GO_VERSION"
          test "$(go env GOTOOLCHAIN)" = "$GOTOOLCHAIN"
          test "$(go env GOSUMDB)" = "$GOSUMDB"
          test "$(uname -m)" = x86_64
      - name: Run release source gate
        run: bash scripts/ci-release-verify.sh

  x86:
    name: x86-64 ISO and upgrade
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/go.sum
      - name: Install x86 build tools
        run: |
          chmod +x scripts/*.sh packaging/rootfs-overlay/usr/lib/ly-route/*.sh
          bash scripts/normalize-source-line-endings.sh "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y mmdebstrap debian-archive-keyring zstd ca-certificates \
            build-essential cmake dpkg-dev git curl gdisk parted dosfstools rsync \
            grub-pc-bin grub-efi-amd64-bin shim-signed e2fsprogs util-linux \
            xorriso isolinux syslinux-common
          curl -fsSL https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb -o /tmp/live-build.deb
          sudo dpkg -i /tmp/live-build.deb || true
          sudo apt-get install -f -y
      - name: Restore x86 VPP package cache
        id: vpp-cache
        uses: actions/cache@v5
        with:
          path: |
            vpp-base-debs
            vpp-dev-debs
          key: vpp-bookworm-amd64-${{ env.LY_ROUTE_VPP_COMMIT }}-${{ hashFiles('scripts/build-vpp-bookworm-debs.sh', 'packaging/vpp-patches/**') }}
      - name: Fetch pinned VPP
        if: steps.vpp-cache.outputs.cache-hit != 'true'
        run: |
          git init vpp-master
          git -C vpp-master remote add origin https://github.com/FDio/vpp.git
          git -C vpp-master fetch --depth 512 origin "$LY_ROUTE_VPP_COMMIT" '+refs/tags/v25.10:refs/tags/v25.10'
          git -C vpp-master checkout --detach "$LY_ROUTE_VPP_COMMIT"
          test "$(git -C vpp-master rev-parse HEAD)" = "$LY_ROUTE_VPP_COMMIT"
      - name: Build x86 runtime packages
        run: |
          mkdir -p runtime-debs vpp-base-debs vpp-dev-debs
          if [ "${{ steps.vpp-cache.outputs.cache-hit }}" != true ]; then
            sudo --preserve-env=LY_ROUTE_VPP_COMMIT,LY_ROUTE_MIRROR,LY_ROUTE_VPP_DEV_DEBS_DIR env \
              LY_ROUTE_RUNTIME_DEB_ARCH=amd64 LY_ROUTE_VPP_SRC="$PWD/vpp-master" \
              LY_ROUTE_RUNTIME_DEBS_DIR="$PWD/vpp-base-debs" \
              LY_ROUTE_VPP_DEV_DEBS_DIR="$PWD/vpp-dev-debs" \
              LY_ROUTE_VPP_MAKE_ARGS=DPDK_MLX_IBV_LINK=dlopen ./scripts/build-vpp-bookworm-debs.sh
            sudo chown -R "$USER:$USER" vpp-base-debs vpp-dev-debs vpp-master
          fi
          cp vpp-base-debs/*.deb runtime-debs/
          test -n "$(find vpp-dev-debs -maxdepth 1 -name 'vpp-dev_*.deb' -print -quit)"
          test -n "$(find vpp-dev-debs -maxdepth 1 -name 'libvppinfra-dev_*.deb' -print -quit)"
          vpp_package=$(find runtime-debs -maxdepth 1 -name 'vpp_*.deb' -print -quit)
          test -f "$vpp_package"
          export LY_ROUTE_RUNTIME_DEB_ARCH=amd64 LY_ROUTE_VPP_DEV_DEBS_DIR="$PWD/vpp-dev-debs" LY_ROUTE_VPP_PACKAGE_VERSION="$(dpkg-deb -f "$vpp_package" Version)"
          sudo --preserve-env=LY_ROUTE_SMARTDNS_REF,LY_ROUTE_MIRROR,LY_ROUTE_RUNTIME_DEB_ARCH,LY_ROUTE_VPP_DEV_DEBS_DIR,LY_ROUTE_VPP_PACKAGE_VERSION ./scripts/build-runtime-debs.sh smartdns
          sudo chown -R "$USER:$USER" runtime-debs tmp
          ./scripts/build-runtime-debs.sh dns-vpp-proxy
          ./scripts/build-runtime-debs.sh xray
          for target in vpp-apply vpp-pppoe-client vpp-smart-qos vpp-security-guard vpp-dns-intercept vpp-pre-nat-route; do
            sudo --preserve-env=LY_ROUTE_RUNTIME_DEB_ARCH,LY_ROUTE_VPP_DEV_DEBS_DIR,LY_ROUTE_VPP_PACKAGE_VERSION ./scripts/build-runtime-debs.sh "$target"
          done
      - name: Build x86 rootfs, upgrade and ISO
        run: |
          sudo --preserve-env=LY_ROUTE_MIRROR env LY_ROUTE_EXTRA_DEBS_DIR="$PWD/runtime-debs" ./scripts/build-rootfs.sh --product gateway --arch amd64 --out dist/rootfs
          sudo chown -R "$USER:$USER" dist
          LY_ROUTE_EXTRA_DEBS_DIR="$PWD/runtime-debs" ./scripts/build-upgrade-package.sh --product gateway --arch amd64 --out dist/upgrade
          sudo --preserve-env=LY_ROUTE_MIRROR,LY_ROUTE_SECURITY_MIRROR ./scripts/build-disk-image.sh --product gateway --rootfs dist/rootfs/ly-route-rootfs-gateway-bookworm-amd64.tar.zst --out dist/disk --size 4G
          sudo --preserve-env=LY_ROUTE_MIRROR,LY_ROUTE_SECURITY_MIRROR ./scripts/build-auto-install-iso.sh --product gateway --image dist/disk/ly-route-gateway-bookworm-amd64-4g.img.zst --out dist/iso
      - name: Verify x86 deliverables
        run: |
          test -s dist/iso/ly-route-gateway-x86_64-installer.iso
          test -s dist/iso/ly-route-gateway-x86_64-installer.iso.sha256
          test -s dist/upgrade/ly-route-upgrade-gateway-bookworm-amd64.tar.zst
          test -s dist/upgrade/ly-route-upgrade-gateway-bookworm-amd64.tar.zst.sha256
          sha256sum -c dist/iso/ly-route-gateway-x86_64-installer.iso.sha256
          sha256sum -c dist/upgrade/ly-route-upgrade-gateway-bookworm-amd64.tar.zst.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ly-route-gateway-x86-64
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/iso/ly-route-gateway-x86_64-installer.iso
            dist/iso/ly-route-gateway-x86_64-installer.iso.sha256
            dist/iso/*.manifest.json
            dist/iso/*.manifest.json.sha256
            dist/upgrade/ly-route-upgrade-gateway-bookworm-amd64.tar.zst
            dist/upgrade/ly-route-upgrade-gateway-bookworm-amd64.tar.zst.sha256

  arm64:
    name: ARM64 Armbian installer and upgrade
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/go.sum
      - name: Install ARM build tools and verify host
        env:
          LY_ROUTE_EXPECT_HOST_ARCH: aarch64
          LY_ROUTE_EXPECT_GOARCH: arm64
          LY_ROUTE_EXPECT_DEB_ARCH: arm64
        run: |
          chmod +x scripts/*.sh packaging/rootfs-overlay/usr/lib/ly-route/*.sh
          bash scripts/normalize-source-line-endings.sh "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo apt-get install -y mmdebstrap debian-archive-keyring zstd ca-certificates build-essential cmake dpkg-dev git curl rsync python3 debhelper devscripts
          test "$(go version | awk '{print $3}')" = "$LY_ROUTE_GO_VERSION"
          test "$(uname -m)" = aarch64
      - name: Restore ARM VPP package cache
        id: vpp-cache
        uses: actions/cache@v5
        with:
          path: |
            vpp-base-debs
            vpp-dev-debs
          key: vpp-bookworm-arm64-${{ env.LY_ROUTE_VPP_COMMIT }}-${{ hashFiles('scripts/build-vpp-bookworm-debs.sh', 'packaging/vpp-patches/**') }}
      - name: Fetch pinned VPP
        if: steps.vpp-cache.outputs.cache-hit != 'true'
        run: |
          git init vpp-master
          git -C vpp-master remote add origin https://github.com/FDio/vpp.git
          git -C vpp-master fetch --depth 512 origin "$LY_ROUTE_VPP_COMMIT" '+refs/tags/v25.10:refs/tags/v25.10'
          git -C vpp-master checkout --detach "$LY_ROUTE_VPP_COMMIT"
          test "$(git -C vpp-master rev-parse HEAD)" = "$LY_ROUTE_VPP_COMMIT"
      - name: Build ARM64 runtime packages
        run: |
          mkdir -p runtime-debs vpp-base-debs vpp-dev-debs
          if [ "${{ steps.vpp-cache.outputs.cache-hit }}" != true ]; then
            sudo --preserve-env=LY_ROUTE_VPP_COMMIT,LY_ROUTE_MIRROR,LY_ROUTE_VPP_DEV_DEBS_DIR env \
              LY_ROUTE_RUNTIME_DEB_ARCH=arm64 LY_ROUTE_VPP_SRC="$PWD/vpp-master" \
              LY_ROUTE_RUNTIME_DEBS_DIR="$PWD/vpp-base-debs" \
              LY_ROUTE_VPP_DEV_DEBS_DIR="$PWD/vpp-dev-debs" \
              LY_ROUTE_VPP_MAKE_ARGS=DPDK_MLX_IBV_LINK=dlopen ./scripts/build-vpp-bookworm-debs.sh
            sudo chown -R "$USER:$USER" vpp-base-debs vpp-dev-debs vpp-master
          fi
          cp vpp-base-debs/*.deb runtime-debs/
          test -n "$(find vpp-dev-debs -maxdepth 1 -name 'vpp-dev_*.deb' -print -quit)"
          test -n "$(find vpp-dev-debs -maxdepth 1 -name 'libvppinfra-dev_*.deb' -print -quit)"
          vpp_package=$(find runtime-debs -maxdepth 1 -name 'vpp_*.deb' -print -quit)
          test -f "$vpp_package"
          export LY_ROUTE_RUNTIME_DEB_ARCH=arm64 LY_ROUTE_VPP_DEV_DEBS_DIR="$PWD/vpp-dev-debs" LY_ROUTE_VPP_PACKAGE_VERSION="$(dpkg-deb -f "$vpp_package" Version)"
          sudo --preserve-env=LY_ROUTE_RUNTIME_DEB_ARCH,LY_ROUTE_SMARTDNS_REF,LY_ROUTE_MIRROR,LY_ROUTE_VPP_DEV_DEBS_DIR,LY_ROUTE_VPP_PACKAGE_VERSION ./scripts/build-runtime-debs.sh smartdns
          sudo chown -R "$USER:$USER" runtime-debs tmp
          ./scripts/build-runtime-debs.sh dns-vpp-proxy
          ./scripts/build-runtime-debs.sh xray
          for target in vpp-apply vpp-pppoe-client vpp-smart-qos vpp-security-guard vpp-dns-intercept vpp-pre-nat-route; do ./scripts/build-runtime-debs.sh "$target"; done
      - name: Build ARM64 rootfs, installer and upgrade
        run: |
          sudo --preserve-env=LY_ROUTE_MIRROR env LY_ROUTE_EXTRA_DEBS_DIR="$PWD/runtime-debs" ./scripts/build-rootfs.sh --product gateway --arch arm64 --out dist/rootfs
          sudo chown -R "$USER:$USER" dist
          LY_ROUTE_EXTRA_DEBS_DIR="$PWD/runtime-debs" ./scripts/build-upgrade-package.sh --product gateway --arch arm64 --out dist/upgrade
          ./scripts/build-armbian-installer.sh --product gateway --rootfs dist/rootfs/ly-route-rootfs-gateway-bookworm-arm64.tar.zst --runtime-debs runtime-debs --out dist/armbian
      - name: Verify ARM deliverables
        run: |
          test -s dist/armbian/ly-route-gateway-armbian-bookworm-arm64-installer.tar.zst
          test -s dist/armbian/ly-route-gateway-armbian-bookworm-arm64-installer.tar.zst.sha256
          test -s dist/upgrade/ly-route-upgrade-gateway-bookworm-arm64.tar.zst
          test -s dist/upgrade/ly-route-upgrade-gateway-bookworm-arm64.tar.zst.sha256
          sha256sum -c dist/armbian/ly-route-gateway-armbian-bookworm-arm64-installer.tar.zst.sha256
          sha256sum -c dist/upgrade/ly-route-upgrade-gateway-bookworm-arm64.tar.zst.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ly-route-gateway-armbian-arm64
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/armbian/ly-route-gateway-armbian-bookworm-arm64-installer.tar.zst
            dist/armbian/ly-route-gateway-armbian-bookworm-arm64-installer.tar.zst.sha256
            dist/upgrade/ly-route-upgrade-gateway-bookworm-arm64.tar.zst
            dist/upgrade/ly-route-upgrade-gateway-bookworm-arm64.tar.zst.sha256

  release:
    name: Publish release assets
    needs: [verify, x86, arm64]
    if: >-
      always() && needs.verify.result == 'success' && needs.x86.result == 'success' && needs.arm64.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ly-route-gateway-x86-64
          path: release/x86
      - uses: actions/download-artifact@v8
        with:
          name: ly-route-gateway-armbian-arm64
          path: release/arm64
      - name: Build checksums
        run: find release -type f ! -name '*.sha256' -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag="${{ inputs.release_tag }}"; fi
          gh release create "$tag" release/**/* release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Ly Route Gateway $tag" --generate-notes
