server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    ssl_certificate /etc/ly-route/tls/admin.crt;
    ssl_certificate_key /etc/ly-route/tls/admin.key;
    root /opt/ly-route/admin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    location /api/v1/ {
        client_max_body_size 5g;
        proxy_pass http://gateway-e2e-vpp:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
